  posix-builds:
    name: ${{ matrix.name }}
    needs: script-smoke
    runs-on: ${{ matrix.os }}
    # About 300 Python checks, the build and the Meson suite: a passing run
    # takes longer than 90 minutes on the hosted runners.
    timeout-minutes: 150
    env:
      OPENQ4_GAMELIBS_REPO: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Push Verification
            os: ubuntu-24.04
            artifact_name: linux-x64
            runtime_smoke: true
            macos_graphics_bridge: ""
            macos_openal_provider: ""
          - name: Linux ARM64 Push Verification
            os: ubuntu-24.04-arm
            artifact_name: linux-arm64
            runtime_smoke: true
            macos_graphics_bridge: ""
            macos_openal_provider: ""
          - name: macOS OpenGL Push Verification
            os: macos-15
            artifact_name: macos-opengl
            runtime_smoke: true
            macos_graphics_bridge: opengl
            macos_openal_provider: system
          - name: macOS Metal Push Verification
            os: macos-15
            artifact_name: macos-metal
            runtime_smoke: true
            macos_graphics_bridge: metal
            macos_openal_provider: system
          - name: macOS Intel x64 OpenGL Push Verification
            os: macos-15-intel
            artifact_name: macos-x64-opengl
            runtime_smoke: true
            macos_graphics_bridge: opengl
            macos_openal_provider: system
          - name: macOS Intel x64 Metal Push Verification
            os: macos-15-intel
            artifact_name: macos-x64-metal
            runtime_smoke: true
            macos_graphics_bridge: metal
            macos_openal_provider: system
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Java for Android host storage validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Meson and Ninja
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Prepare pinned OpenAL Soft (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          architecture=arm64
          if [[ "${{ matrix.os }}" == "macos-15-intel" ]]; then
            architecture=x64
          fi
          prepared_root="${GITHUB_WORKSPACE}/.tmp/openal-soft-macos-${architecture}"
          bash tools/build/prepare_macos_openal_soft.sh \
            --architecture "${architecture}" \
            --deployment-target 11.0 \
            --output-root "${prepared_root}" \
            --stage-install-dir .install
          echo "PKG_CONFIG_PATH=${prepared_root}/lib/pkgconfig" >> "${GITHUB_ENV}"

      - name: Install Linux native dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
              binutils \
              libasound2-dev \
              libdbus-1-dev \
              libdecor-0-dev \
              libdrm-dev \
              libegl1-mesa-dev \
              libfribidi-dev \
              libgbm-dev \
              libgl1-mesa-dri \
              libgl1-mesa-dev \
              libglx-mesa0 \
              libvulkan1 \
              mesa-vulkan-drivers \
              vulkan-validationlayers \
              libibus-1.0-dev \
              libjack-dev \
              libopenal-dev \
              libpipewire-0.3-dev \
              libpulse-dev \
              libsndio-dev \
              libthai-dev \
              libudev-dev \
              libwayland-dev \
              libx11-dev \
              libxcursor-dev \
              libxext-dev \
              libxfixes-dev \
              libxi-dev \
              libxkbcommon-dev \
              libxrandr-dev \
              libxss-dev \
              libxtst-dev \
              libxxf86dga-dev \
              libxxf86vm-dev \
              xvfb; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to install Linux native dependencies after ${attempt} attempts."
              exit 1
            fi

            echo "Linux dependency installation attempt ${attempt} failed; retrying in 10 seconds..."
            sleep 10
          done

      - name: Run push verification
        shell: bash
        run: |
          set -euo pipefail
          validation_args=(--install --fail-on-dirty)
          if [[ -n "${{ matrix.macos_graphics_bridge }}" ]]; then
            validation_args+=(
              --platform-backend=sdl3
              --extra-setup-arg=-Dmacos_graphics_bridge=${{ matrix.macos_graphics_bridge }}
              --extra-setup-arg=-Dmacos_openal_provider=${{ matrix.macos_openal_provider }}
            )
          fi
          if [[ "${{ matrix.runtime_smoke }}" == "true" ]]; then
            runtime_cases="renderer-foundation-selftests,renderer-pbr-visible-selftest,renderer-cluster-grid-selftest,renderer-default-safety-selftest"
            if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
              runtime_cases="${runtime_cases},renderer-shadow-planner-selftest,renderer-shadow-projected-diagnostic,sdl3-x11-display-diagnostics"
              runtime_cases="${runtime_cases},renderer-vk-clear-startup,renderer-vk-probe-source-lifecycle,renderer-vk-hdr-selftest,renderer-vk-temporal-motion-selftest,renderer-vk-fallback-drill,renderer-vk-device-fallback-drill,renderer-vk-window-recovery,renderer-vk-surface-recovery,renderer-vk-swapchain-recovery,renderer-vk-resources-recovery"
              # Require the software Vulkan driver explicitly on both runner
              # architectures. Missing packages are failures, not skipped tests.
              shopt -s nullglob
              vulkan_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
              [[ ${#vulkan_icds[@]} -eq 1 && -f "${vulkan_icds[0]}" ]]
              export VK_DRIVER_FILES="${vulkan_icds[0]}"
              export VK_ICD_FILENAMES="${vulkan_icds[0]}"
            fi
            validation_args+=(
              --runtime
              --runtime-cases "${runtime_cases}"
              --runtime-tiers auto
              --runtime-basepath ""
              --runtime-skip-official-pak-validation
            )
            if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
              env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_DRIVER=x11 SDL_VIDEODRIVER=x11 xvfb-run -a bash tools/validation/validate_push.sh "${validation_args[@]}"
              env LIBGL_ALWAYS_SOFTWARE=1 OPENQ4_FORCE_X11=1 xvfb-run -a python tools/tests/renderer_validation_matrix.py \
                --cases sdl3-force-x11-display-diagnostics \
                --tiers auto \
                --basepath "" \
                --skip-official-pak-validation \
                --output-dir .tmp/renderer-validation/force-x11
            else
              bash tools/validation/validate_push.sh "${validation_args[@]}"
            fi
          else
            bash tools/validation/validate_push.sh "${validation_args[@]}"
          fi

      - name: Run Linux dedicated server smoke
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          python tools/tests/linux_dedicated_server_smoke.py \
            --output-root .tmp/linux-dedicated-smoke/${{ matrix.artifact_name }}

      - name: Publish Linux dedicated server smoke
        if: always() && startsWith(matrix.os, 'ubuntu-')
        uses: actions/upload-artifact@v7
        with:
          name: push-${{ matrix.artifact_name }}-dedicated-smoke
          path: .tmp/linux-dedicated-smoke/${{ matrix.artifact_name }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Run macOS dedicated server smoke
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          python tools/tests/macos_dedicated_server_smoke.py \
            --output-root .tmp/macos-dedicated-smoke/${{ matrix.artifact_name }}

      - name: Publish macOS dedicated server smoke
        if: always() && startsWith(matrix.os, 'macos-')
        uses: actions/upload-artifact@v7
        with:
          name: push-${{ matrix.artifact_name }}-dedicated-smoke
          path: .tmp/macos-dedicated-smoke/${{ matrix.artifact_name }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Publish staged payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: push-${{ matrix.artifact_name }}-payload
          path: .install
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Publish renderer validation reports
        if: always() && matrix.runtime_smoke == true
        uses: actions/upload-artifact@v7
        with:
          name: push-${{ matrix.artifact_name }}-renderer-validation
          path: .tmp/renderer-validation
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  windows-build:
    name: Windows Push Verification
    needs: script-smoke
    runs-on: windows-2025-vs2026
    timeout-minutes: 150
    env:
      OPENQ4_GAMELIBS_REPO: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Java for Android host storage validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Meson and Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Prepare OpenAL Soft (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp/openal-soft-x64"
          $env:OPENQ4_VS_TARGET_ARCH = "x64"
          powershell -ExecutionPolicy Bypass -File tools/build/prepare_windows_openal.ps1 -Architecture "x64" -OutputRoot $outputRoot
          "OPENQ4_OPENAL_ROOT=$outputRoot" >> $env:GITHUB_ENV

      - name: Run push verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/validation/validate_push.ps1 --install --fail-on-dirty

      - name: Run Windows x64 dedicated server smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/tests/windows_dedicated_server_smoke.py --arch x64 --output-root .tmp/windows-dedicated-smoke/x64

      - name: Publish Windows x64 dedicated server smoke
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: push-windows-x64-dedicated-smoke
          path: .tmp/windows-dedicated-smoke/x64
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Run focused input-safety static analysis
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/analysis/clang_tidy_input_safety.py --build-dir builddir

      - name: Validate Windows text-store SDK boundary
        shell: cmd
        run: |
          call tools\build\openq4_devcmd.cmd
          if errorlevel 1 exit /b 1
          python tools\tests\windows_text_store.py
          if errorlevel 1 exit /b 1
          python tools\tests\windows_text_collection_bridge.py --sdl-include subprojects/SDL3-3.4.16/include
          if errorlevel 1 exit /b 1
          python tools\tests\windows_text_collection_bridge.py --compiler cl --msvc-debug --sdl-include subprojects/SDL3-3.4.16/include
          if errorlevel 1 exit /b 1
          python tools\tests\windows_text_collection_bridge.py --unsupported --sdl-include subprojects/SDL3-3.4.16/include
          if errorlevel 1 exit /b 1
          python tools\tests\windows_text_session.py --sdl-include subprojects/SDL3-3.4.16/include
          if errorlevel 1 exit /b 1
          python tools\tests\windows_text_session.py --compiler cl --msvc-debug --no-mutations --sdl-include subprojects/SDL3-3.4.16/include
          if errorlevel 1 exit /b 1
          python tools\tests\windows_text_session.py --route-facts --sdl-include subprojects/SDL3-3.4.16/include
          if errorlevel 1 exit /b 1
          python tools\tests\native_input_facts.py --compiler cl --msvc-debug --no-mutations --sdl-include subprojects/SDL3-3.4.16/include
          if errorlevel 1 exit /b 1
          python tools\tests\native_input_terminal.py --compiler cl --msvc-debug --no-mutations --sdl-include subprojects/SDL3-3.4.16/include

      - name: Publish staged payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: push-windows-payload
          path: .install
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  windows-arm64-build:
    name: Windows ARM64 Push Verification
    needs: script-smoke
    runs-on: windows-11-arm
    timeout-minutes: 150
    env:
      OPENQ4_GAMELIBS_REPO: ${{ github.workspace }}
      OPENQ4_VS_TARGET_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Meson and Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Prepare OpenAL Soft (Windows ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp/openal-soft-arm64"
          powershell -ExecutionPolicy Bypass -File tools/build/prepare_windows_openal.ps1 -Architecture "arm64" -OutputRoot $outputRoot
          "OPENQ4_OPENAL_ROOT=$outputRoot" >> $env:GITHUB_ENV

      # The bundled OpenAL import library is x64-only, so the arm64 build links
      # the package prepared above, as the release job does. The runner is
      # called directly because a script's parameter binder can split this
      # argument at the drive-letter colon (pwsh -File validate_push.ps1 does).
      - name: Run push verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/validation/openq4_validate.py push --install --fail-on-dirty "--extra-setup-arg=-Dopenal_root_override=$env:OPENQ4_OPENAL_ROOT"

      - name: Run Windows ARM64 dedicated server smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/tests/windows_dedicated_server_smoke.py --arch arm64 --output-root .tmp/windows-dedicated-smoke/arm64

      - name: Publish Windows ARM64 dedicated server smoke
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: push-windows-arm64-dedicated-smoke
          path: .tmp/windows-dedicated-smoke/arm64
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Publish staged payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: push-windows-arm64-payload
          path: .install
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
