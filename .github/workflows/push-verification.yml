name: Push Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openq4-push-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-smoke:
    name: Validation Script Smoke
    runs-on: ubuntu-24.04
    env:
      OPENQ4_GAMELIBS_REPO: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Java for Android host storage validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native display test headers
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev

      - name: Install release documentation dependency
        run: python -m pip install markdown

      # Native UI harnesses compile jsoncpp/libtess2 wrap sources, which a fresh
      # checkout lacks until Meson provisions them (tools/tests/wrap_sources.py).
      - name: Install Meson for wrap-sourced test harnesses
        run: python -m pip install meson

      - name: Check validation script syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/build/android_cross.py \
            tools/build/android_elf.py \
            tools/build/prepare_android_deps.py \
            tools/build/build_openq4_pack.py \
            tools/build/build_pak0.py \
            tools/build/build_windows_installer.py \
            tools/build/check_staged_content_edits.py \
            tools/build/generate_pak_header.py \
            tools/build/generate_release_changelog.py \
            tools/build/generate_release_docs.py \
            tools/build/linux_metadata.py \
            tools/build/list_pak_sources.py \
            tools/build/openq4_pak.py \
            tools/build/openq4_release_version.py \
