      - name: Fetch openQ4-game
        shell: bash
        run: |
          set -euo pipefail
          git init "${OPENQ4_GAMELIBS_REPO}"
          git -C "${OPENQ4_GAMELIBS_REPO}" remote add origin https://github.com/themuffinator/openQ4-game.git
          git -C "${OPENQ4_GAMELIBS_REPO}" fetch --depth 1 origin "${OPENQ4_GAMELIBS_SHA}"
          git -C "${OPENQ4_GAMELIBS_REPO}" checkout --detach "${OPENQ4_GAMELIBS_SHA}"
          test "$(git -C "${OPENQ4_GAMELIBS_REPO}" rev-parse HEAD)" = "${OPENQ4_GAMELIBS_SHA}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Java for Android host storage validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Meson and Ninja
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Install Linux native dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
              binutils \
              libasound2-dev \
              libdbus-1-dev \
              libdecor-0-dev \
              libdrm-dev \
              libegl1-mesa-dev \
              libfribidi-dev \
              libgbm-dev \
              libgl1-mesa-dri \
              libgl1-mesa-dev \
              libglx-mesa0 \
              libibus-1.0-dev \
              libjack-dev \
              libopenal-dev \
              libpipewire-0.3-dev \
              libpulse-dev \
              libsndio-dev \
              libthai-dev \
              libudev-dev \
              libwayland-dev \
              libx11-dev \
              libxcursor-dev \
              libxext-dev \
              libxfixes-dev \
              libxi-dev \
              libxkbcommon-dev \
              libxrandr-dev \
              libxss-dev \
              libxtst-dev \
              libxxf86dga-dev \
              libxxf86vm-dev \
              weston; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to install Linux native dependencies after ${attempt} attempts."
              exit 1
            fi

            echo "Linux dependency installation attempt ${attempt} failed; retrying in 10 seconds..."
            sleep 10
          done

      - name: Run sanitizer build
        shell: bash
        run: |
          set -euo pipefail
          bash tools/validation/validate_pr.sh \
            --skip-python-tests \
            --no-install \
            --build-dir .tmp/validation/linux-sanitizer-builddir \
            --buildtype debugoptimized \
            --jobs 2 \
            --extra-setup-arg=-Duse_pch=false \
            --extra-setup-arg=-Db_sanitize=address,undefined

      - name: Stage sanitizer runtime
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build/meson_setup.sh install \
            -C .tmp/validation/linux-sanitizer-builddir \
            --no-rebuild \
            --skip-subprojects

      - name: Run sanitizer native Wayland smoke
        shell: bash
        run: |
          set -euo pipefail

          output_dir=".tmp/renderer-validation/sanitizer"
          rm -rf "${output_dir}"
          mkdir -p "${output_dir}"

          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/openq4-sanitizer-wayland-runtime"
          rm -rf "${XDG_RUNTIME_DIR}"
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 700 "${XDG_RUNTIME_DIR}"

          weston_log="${output_dir}/weston.log"
          weston --backend=headless-backend.so --socket=openq4-sanitizer-wayland --idle-time=0 --no-config >"${weston_log}" 2>&1 &
          weston_pid=$!
          cleanup() {
            status=$?
            if [ "${status}" -ne 0 ] && [ -f "${weston_log}" ]; then
              echo "Weston log:"
              cat "${weston_log}"
            fi
            kill "${weston_pid}" >/dev/null 2>&1 || true
            wait "${weston_pid}" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if [ -S "${XDG_RUNTIME_DIR}/openq4-sanitizer-wayland" ]; then
              break
            fi
            sleep 1
          done
          if [ ! -S "${XDG_RUNTIME_DIR}/openq4-sanitizer-wayland" ]; then
            echo "Weston did not create the sanitizer Wayland socket."
            exit 1
          fi

          export WAYLAND_DISPLAY=openq4-sanitizer-wayland
          unset DISPLAY
          export SDL_VIDEO_DRIVER=wayland
          export SDL_VIDEODRIVER=wayland
          export LIBGL_ALWAYS_SOFTWARE=1
          export OPENQ4_WAYLAND_DISABLE_LIBDECOR=1

          python tools/tests/renderer_validation_matrix.py \
            --cases sdl3-wayland-window-lifecycle \
            --tiers auto \
            --timeout 120 \
            --basepath "" \
            --skip-official-pak-validation \
            --output-dir "${output_dir}"

      - name: Publish sanitizer validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commit-linux-sanitizer-build-logs
          path: |
            .tmp/validation/linux-sanitizer-builddir/meson-logs
            .tmp/gamelibs_stage-linux-x64/openq4_gamelibs_stage_manifest.json
            .tmp/renderer-validation/sanitizer
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

