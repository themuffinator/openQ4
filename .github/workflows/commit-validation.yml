            expected_uname: x86_64
            compiler_label: GCC
            cc: gcc
            cxx: g++
            libdecor_label: libdecor
            disable_libdecor: "0"
            prefer_libdecor: "1"
            sync_window_ops: "0"
            linux_x11: auto
            artifact_suffix: x64-libdecor
          - arch_label: x64
            runner: ubuntu-24.04
            expected_uname: x86_64
            compiler_label: GCC
            cc: gcc
            cxx: g++
            libdecor_label: no-libdecor
            disable_libdecor: "1"
            prefer_libdecor: "0"
            sync_window_ops: "0"
            linux_x11: disabled
            artifact_suffix: x64-no-libdecor-wayland-only
          - arch_label: x64
            runner: ubuntu-24.04
            expected_uname: x86_64
            compiler_label: Clang
            cc: clang
            cxx: clang++
            libdecor_label: no-libdecor
            disable_libdecor: "1"
            prefer_libdecor: "0"
            sync_window_ops: "0"
            linux_x11: disabled
            artifact_suffix: x64-clang-no-libdecor-wayland-only
          - arch_label: x64
            runner: ubuntu-24.04
            expected_uname: x86_64
            compiler_label: GCC
            cc: gcc
            cxx: g++
            libdecor_label: sync-window-ops
            disable_libdecor: "0"
            prefer_libdecor: "0"
            sync_window_ops: "1"
            linux_x11: auto
            artifact_suffix: x64-sync-window-ops
          - arch_label: ARM64
            runner: ubuntu-24.04-arm
            expected_uname: aarch64
            compiler_label: GCC
            cc: gcc
            cxx: g++
            libdecor_label: libdecor
            disable_libdecor: "0"
            prefer_libdecor: "1"
            sync_window_ops: "0"
            linux_x11: auto
            artifact_suffix: arm64-libdecor
          - arch_label: ARM64
            runner: ubuntu-24.04-arm
            expected_uname: aarch64
            compiler_label: Clang
            cc: clang
            cxx: clang++
            libdecor_label: no-libdecor
            disable_libdecor: "1"
            prefer_libdecor: "0"
            sync_window_ops: "0"
            linux_x11: disabled
            artifact_suffix: arm64-clang-no-libdecor-wayland-only

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch openQ4-game
        shell: bash
        run: |
          set -euo pipefail
          git init "${OPENQ4_GAMELIBS_REPO}"
          git -C "${OPENQ4_GAMELIBS_REPO}" remote add origin https://github.com/themuffinator/openQ4-game.git
          git -C "${OPENQ4_GAMELIBS_REPO}" fetch --depth 1 origin "${OPENQ4_GAMELIBS_SHA}"
          git -C "${OPENQ4_GAMELIBS_REPO}" checkout --detach "${OPENQ4_GAMELIBS_SHA}"
          test "$(git -C "${OPENQ4_GAMELIBS_REPO}" rev-parse HEAD)" = "${OPENQ4_GAMELIBS_SHA}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Java for Android host storage validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Meson and Ninja
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Install Clang
        if: matrix.compiler_label == 'Clang'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Install Linux Wayland dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
              binutils \
              libasound2-dev \
              libdbus-1-dev \
              libdecor-0-dev \
              libdrm-dev \
              libegl1-mesa-dev \
              libfribidi-dev \
              libgbm-dev \
              libgl1-mesa-dri \
              libgl1-mesa-dev \
              libglx-mesa0 \
              libibus-1.0-dev \
              libjack-dev \
              libopenal-dev \
              libpipewire-0.3-dev \
              libpulse-dev \
              libsndio-dev \
              libthai-dev \
              libudev-dev \
              libwayland-dev \
              libx11-dev \
              libxcursor-dev \
              libxext-dev \
              libxfixes-dev \
              libxi-dev \
              libxkbcommon-dev \
              libxrandr-dev \
              libxss-dev \
              libxtst-dev \
              libxxf86dga-dev \
              libxxf86vm-dev \
              weston; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to install Linux Wayland dependencies after ${attempt} attempts."
              exit 1
            fi

            echo "Linux Wayland dependency installation attempt ${attempt} failed; retrying in 10 seconds..."
            sleep 10
          done

      - name: Run native Wayland validation
        shell: bash
        run: |
          set -euo pipefail

          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/openq4-wayland-runtime"
          rm -rf "${XDG_RUNTIME_DIR}"
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 700 "${XDG_RUNTIME_DIR}"

          weston_log="${RUNNER_TEMP}/openq4-weston-${{ matrix.artifact_suffix }}.log"
          weston --backend=headless-backend.so --socket=openq4-wayland --idle-time=0 --no-config >"${weston_log}" 2>&1 &
          weston_pid=$!
          cleanup() {
            status=$?
            if [ "${status}" -ne 0 ] && [ -f "${weston_log}" ]; then
              echo "Weston log:"
              cat "${weston_log}"
            fi
            kill "${weston_pid}" >/dev/null 2>&1 || true
            wait "${weston_pid}" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if [ -S "${XDG_RUNTIME_DIR}/openq4-wayland" ]; then
              break
            fi
            sleep 1
          done
          if [ ! -S "${XDG_RUNTIME_DIR}/openq4-wayland" ]; then
            echo "Weston did not create the Wayland socket."
            exit 1
          fi

          export WAYLAND_DISPLAY=openq4-wayland
          unset DISPLAY
          if [ "$(uname -m)" != "${{ matrix.expected_uname }}" ]; then
            echo "Unexpected runner architecture: $(uname -m); expected ${{ matrix.expected_uname }}."
            exit 1
          fi
          export SDL_VIDEO_DRIVER=wayland
          export SDL_VIDEODRIVER=wayland
          export LIBGL_ALWAYS_SOFTWARE=1
          if [ "${{ matrix.disable_libdecor }}" = "1" ]; then
            export OPENQ4_WAYLAND_DISABLE_LIBDECOR=1
          else
            unset OPENQ4_WAYLAND_DISABLE_LIBDECOR
          fi
          if [ "${{ matrix.prefer_libdecor }}" = "1" ]; then
            export OPENQ4_WAYLAND_PREFER_LIBDECOR=1
          else
            unset OPENQ4_WAYLAND_PREFER_LIBDECOR
          fi
          if [ "${{ matrix.sync_window_ops }}" = "1" ]; then
            export OPENQ4_WAYLAND_SYNC_WINDOW_OPS=1
          else
            unset OPENQ4_WAYLAND_SYNC_WINDOW_OPS
          fi

          bash tools/validation/validate_pr.sh \
            --build-dir builddir \
            --fail-on-dirty \
            --extra-setup-arg=-Dlinux_x11=${{ matrix.linux_x11 }}

          sdl_config="$(find builddir -name SDL_build_config.h -print -quit)"
          test -n "${sdl_config}"
          grep -F '#define HAVE_LIBDECOR_H 1' "${sdl_config}"
          grep -F '#define SDL_VIDEO_DRIVER_WAYLAND_DYNAMIC "libwayland-client.so.0"' "${sdl_config}"
          grep -F '#define SDL_VIDEO_DRIVER_WAYLAND_DYNAMIC_LIBDECOR "libdecor-0.so.0"' "${sdl_config}"
          if [ "${{ matrix.linux_x11 }}" = "disabled" ]; then
            grep -F '/* #undef SDL_VIDEO_DRIVER_X11 */' "${sdl_config}"
            for binary in .install/openQ4-client_* .install/openQ4-ded_*; do
              if readelf -W -d "${binary}" | grep -Eq 'libX11|libXext|libGLX'; then
                echo "Native Wayland-only binary unexpectedly depends on X11/GLX: ${binary}"
                exit 1
              fi
            done
          fi

          ld_debug_prefix="${RUNNER_TEMP}/openq4-wayland-loader-${{ matrix.artifact_suffix }}"
          export LD_DEBUG=libs
          export LD_DEBUG_OUTPUT="${ld_debug_prefix}"
          python tools/tests/renderer_validation_matrix.py \
            --cases renderer-default-safety-selftest,sdl3-wayland-window-lifecycle,sdl3-wayland-window-stress,sdl3-wayland-mouse-capture,sdl3-wayland-mouse-capture-stress,sdl3-wayland-display-diagnostics \
            --tiers auto \
            --basepath "" \
            --skip-official-pak-validation
          unset LD_DEBUG LD_DEBUG_OUTPUT

          shopt -s nullglob
          loader_logs=("${ld_debug_prefix}".*)
          if [ "${#loader_logs[@]}" -eq 0 ]; then
            echo "Dynamic-loader diagnostics were not produced."
            exit 1
          fi
          if [ "${{ matrix.prefer_libdecor }}" = "1" ]; then
            grep -hF 'libdecor-0.so.0' "${loader_logs[@]}" >/dev/null
          elif [ "${{ matrix.disable_libdecor }}" = "1" ] && grep -hF 'libdecor-0.so.0' "${loader_logs[@]}" >/dev/null; then
            echo "libdecor loaded despite OPENQ4_WAYLAND_DISABLE_LIBDECOR=1."
            exit 1
          fi

      - name: Run Linux x64 dedicated server smoke
        if: matrix.artifact_suffix == 'x64-libdecor'
        shell: bash
        run: |
          set -euo pipefail
          python tools/tests/linux_dedicated_server_smoke.py \
            --output-root .tmp/linux-dedicated-smoke/x64

      - name: Publish Linux x64 dedicated server smoke
        if: always() && matrix.artifact_suffix == 'x64-libdecor'
        uses: actions/upload-artifact@v6
        with:
          name: commit-linux-x64-dedicated-smoke
          path: .tmp/linux-dedicated-smoke/x64
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Publish renderer validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commit-linux-wayland-${{ matrix.artifact_suffix }}-renderer-validation
          path: .tmp/renderer-validation
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

