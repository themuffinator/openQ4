  macos-universal2:
    # Pre-publication gate only; release artifacts remain arm64-only.
    name: macOS universal2 ${{ matrix.bridge_label }} Assembly
    runs-on: macos-15
    needs:
      - macos-arm64
      - macos-x64
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - bridge_label: OpenGL
            artifact_suffix: opengl
          - bridge_label: Metal
            artifact_suffix: metal

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Java for Android host storage validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install release documentation dependency
        run: python -m pip install markdown

      - name: Download macOS ARM64 thin payload
        uses: actions/download-artifact@v5
        with:
          name: commit-macos-arm64-${{ matrix.artifact_suffix }}-payload
          path: .tmp/macos-universal2/${{ matrix.artifact_suffix }}/arm64

      - name: Download macOS Intel thin payload
        uses: actions/download-artifact@v5
        with:
          name: commit-macos-x64-${{ matrix.artifact_suffix }}-payload
          path: .tmp/macos-universal2/${{ matrix.artifact_suffix }}/x64

      - name: Restore mode-preserving thin payloads
        shell: bash
        run: |
          set -euo pipefail
          corridor_root=".tmp/macos-universal2/${{ matrix.artifact_suffix }}"
          for arch in arm64 x64; do
            payload_archive="${corridor_root}/${arch}/${arch}-${{ matrix.artifact_suffix }}-payload.tar.gz"
            if [ -L "${payload_archive}" ] || [ ! -f "${payload_archive}" ]; then
              echo "Missing regular thin payload archive: ${payload_archive}"
              exit 1
            fi
            tar -tzf "${payload_archive}" >/dev/null
            tar -xzf "${payload_archive}" -C "${corridor_root}/${arch}"
            rm -f "${payload_archive}"
          done

      - name: Assemble exact dual-slice staging tree
        shell: bash
        run: |
          set -euo pipefail
          corridor_root=".tmp/macos-universal2/${{ matrix.artifact_suffix }}"
          mkdir -p "${corridor_root}/package-output"
          python tools/build/assemble_macos_universal2.py assemble \
            --arm64-root "${corridor_root}/arm64" \
            --x64-root "${corridor_root}/x64" \
            --output-root "${corridor_root}/universal2" \
            --assembly-manifest "${corridor_root}/assembly-manifest.json"

      - name: Run native universal2 dedicated-server smoke
        shell: bash
        run: |
          set -euo pipefail
          corridor_root=".tmp/macos-universal2/${{ matrix.artifact_suffix }}"
          python tools/tests/macos_dedicated_server_smoke.py \
            --install-root "${corridor_root}/universal2" \
            --arch universal2 \
            --output-root "${corridor_root}/dedicated-smoke"

      - name: Package and validate universal2 app
        shell: bash
        run: |
          set -euo pipefail
          corridor_root=".tmp/macos-universal2/${{ matrix.artifact_suffix }}"
          export OPENQ4_UNIVERSAL_INSTALL_ROOT="${corridor_root}/universal2"
          release_version="$(python -c 'import json, os; print(json.load(open(os.path.join(os.environ["OPENQ4_UNIVERSAL_INSTALL_ROOT"], "baseoq4", "mod.json"), encoding="utf-8"))["version"])')"
          python tools/build/package_nightly.py \
            --platform macos \
            --arch universal2 \
            --version "${release_version}" \
            --version-tag universal2-ci \
            --source-root . \
            --install-dir "${corridor_root}/universal2" \
            --output-dir "${corridor_root}/package-output" \
            --archive-format tar.xz \
            --package-suffix=-${{ matrix.artifact_suffix }} \
            --macos-signing-mode ad-hoc

      - name: Publish universal2 assembly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commit-macos-universal2-${{ matrix.artifact_suffix }}
          path: .tmp/macos-universal2/${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
