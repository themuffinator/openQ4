name: Commit Validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: openq4-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the companion's GAME_API 48 and retained input/presentation contract.
  # Renderer API 14 device services are private to this engine repository.
  # Publish this companion commit before CI runs.
  OPENQ4_GAMELIBS_SHA: 1cd33980f072ac3d78978a07b388b4b6fe6b5eb2

jobs:
  script-smoke:
    name: Validation Script Smoke
    runs-on: ubuntu-24.04
    env:
      OPENQ4_GAMELIBS_REPO: ${{ github.workspace }}/../openQ4-game

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch openQ4-game
        shell: bash
        run: |
          set -euo pipefail
          git init "${OPENQ4_GAMELIBS_REPO}"
          git -C "${OPENQ4_GAMELIBS_REPO}" remote add origin https://github.com/themuffinator/openQ4-game.git
          git -C "${OPENQ4_GAMELIBS_REPO}" fetch --depth 1 origin "${OPENQ4_GAMELIBS_SHA}"
          git -C "${OPENQ4_GAMELIBS_REPO}" checkout --detach "${OPENQ4_GAMELIBS_SHA}"
          test "$(git -C "${OPENQ4_GAMELIBS_REPO}" rev-parse HEAD)" = "${OPENQ4_GAMELIBS_SHA}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Java for Android host storage validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native display test headers
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev

      - name: Install release documentation dependency
        run: python -m pip install markdown

      - name: Check validation script syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/build/android_cross.py \
            tools/build/android_elf.py \
            tools/build/prepare_android_deps.py \
            tools/build/build_openq4_pack.py \
            tools/build/build_pak0.py \
            tools/build/build_windows_installer.py \
            tools/build/check_staged_content_edits.py \
