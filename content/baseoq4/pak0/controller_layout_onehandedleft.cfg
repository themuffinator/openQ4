//
// CONTROLLER LAYOUT: ONE-HANDED (LEFT)
// Everything on the left half of the controller, for play with the left
// hand alone. Southpaw puts looking on the left stick, the left bumper walks
// forward while held and the left trigger fires. Zoom and crouch toggle,
// since a thumb on the stick cannot also hold the D-pad. Pair it with gyro
// aiming (Settings > Controls > Aim) to turn while walking.
// Applied only when chosen (Settings > Controls > Controller > Layout, or
// controllerLayout onehandedleft). Buttons not listed are left unbound.
//

seta	in_joystickSouthpaw		"1"
seta	in_toggleZoom			"1"
seta	in_toggleCrouch			"1"

bind	JOY1			_forward				// Move forward while held (LB)
bind	JOY16			_attack					// Attack (LT)
bind	JOY13			_moveup					// Jump (L3)
bind	JOY9			_impulse13				// Reload (D-pad Up)
bind	JOY10			_movedown				// Crouch, toggles (D-pad Down)
bind	JOY11			_zoom					// Aim / zoom, toggles (D-pad Right)
bind	JOY12			_weaponWheel			// Weapon wheel (D-pad Left)
bind	JOY8			"togglemenu"			// Toggle menu (View)
bind	JOY20			_back					// Move back while held (left paddle 1)
bind	JOY22			_impulse19				// Scores or objectives while held (left paddle 2)
