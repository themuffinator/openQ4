//
// CONTROLLER LAYOUT: ONE-HANDED (RIGHT)
// Everything on the right half of the controller, for play with the right
// hand alone. The right stick looks, the right bumper walks forward while
// held and the right trigger fires. Zoom and crouch toggle, since a thumb
// on the stick cannot also hold a face button. Pair it with gyro aiming
// (Settings > Controls > Aim) to turn while walking.
// Applied only when chosen (Settings > Controls > Controller > Layout, or
// controllerLayout onehandedright). Buttons not listed are left unbound.
//

seta	in_joystickSouthpaw		"0"
seta	in_toggleZoom			"1"
seta	in_toggleCrouch			"1"

bind	JOY2			_forward				// Move forward while held (RB)
bind	JOY15			_attack					// Attack (RT)
bind	JOY14			_moveup					// Jump (R3)
bind	JOY3			_impulse13				// Reload (A)
bind	JOY4			_movedown				// Crouch, toggles (B)
bind	JOY5			_zoom					// Aim / zoom, toggles (Y)
bind	JOY6			_weaponWheel			// Weapon wheel (X)
bind	JOY7			"togglemenu"			// Toggle menu (Start)
bind	JOY17			"togglemenu"			// Toggle menu (Guide, when delivered by the OS)
bind	JOY19			_back					// Move back while held (right paddle 1)
bind	JOY21			_impulse19				// Scores or objectives while held (right paddle 2)
