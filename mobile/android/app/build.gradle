import java.security.MessageDigest
import groovy.json.JsonSlurper

plugins { id 'com.android.application' }

apply from: rootProject.file('package-manifest.gradle')

def sdlRoot = providers.gradleProperty('sdl3SourceRoot').orNull
if (sdlRoot == null) {
    throw new GradleException('Set -Psdl3SourceRoot to the SDL3 source tree used for the native build.')
}
def sdlJava = new File(sdlRoot, 'android-project/app/src/main/java')
if (!new File(sdlJava, 'org/libsdl/app/SDLActivity.java').isFile()) {
    throw new GradleException('sdl3SourceRoot must contain SDL3 Android Java sources.')
}
def abi = providers.gradleProperty('openq4Abi').getOrElse('arm64-v8a')
if (!(abi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException('openQ4 supports arm64-v8a phones and diagnostic x86_64 emulators only.')
}
def emulator = abi == 'x86_64'
// -Popenq4Quest=true packages the Meta Quest headset flavor from a stage made
// with -Dandroid_headset=true: the phone build declared as an immersive
// OpenXR app, with its own application ID, data and saves.
def questBuild = providers.gradleProperty('openq4Quest').getOrElse('false') == 'true'
if (questBuild && emulator) {
    throw new GradleException('The Meta Quest headset flavor is arm64-v8a only.')
}
def packageVariant = emulator ? 'emulator' : (questBuild ? 'quest' : 'phone')
// -Popenq4XrTestRuntime=<builddir>/libopenq4-xr-test-runtime.so packs the
// headset-free OpenXR test runtime for the emulator VR check. Only the
// debuggable emulator APK may carry it; a stage never does.
def xrTestRuntimePath = providers.gradleProperty('openq4XrTestRuntime').orNull
def xrTestRuntime = xrTestRuntimePath == null ? null : file(xrTestRuntimePath)
if (xrTestRuntime != null) {
    if (!emulator) {
        throw new GradleException('Only the diagnostic x86_64 emulator APK may carry the OpenXR test runtime.')
    }
    if (xrTestRuntime.name != 'libopenq4-xr-test-runtime.so' || !xrTestRuntime.isFile()) {
        throw new GradleException("openq4XrTestRuntime must name a built libopenq4-xr-test-runtime.so, not ${xrTestRuntime}")
    }
}
def moduleArch = emulator ? 'x64' : 'arm64'
def nativeLibraries = ['libquake4.so', 'libSDL3.so', "librenderer-gles_${moduleArch}.so",
                       "libgame-sp_${moduleArch}.so", "libgame-mp_${moduleArch}.so",
                       'libopenal.so', 'libc++_shared.so'].collect { it.toString() }.toSet()
def nativeStage = file(providers.gradleProperty('openq4Stage').getOrElse("../../../.install/android/${abi}"))
def nativeMetadataFile = new File(nativeStage, 'android-build.json')
def modMetadataFile = new File(nativeStage, 'baseoq4/mod.json')
if (!nativeMetadataFile.isFile() || !modMetadataFile.isFile()) {
    throw new GradleException('Missing native build metadata; run the Android Meson install step first.')
}
def nativeMetadata = new JsonSlurper().parse(nativeMetadataFile)
def stagedVariant = nativeMetadata.containsKey('variant') ? nativeMetadata.variant : 'phone'
if (stagedVariant != packageVariant && (stagedVariant == 'quest' || questBuild)) {
    throw new GradleException("The staged ${stagedVariant} build cannot make a ${packageVariant} APK: a Quest stage " +
        '(-Dandroid_headset=true) needs -Popenq4Quest=true, and a Quest APK needs a Quest stage.')
}
if (nativeMetadata.format != 1 || nativeMetadata.abi != abi ||
        stagedVariant != packageVariant ||
        !(nativeMetadata.androidApi instanceof Number) || nativeMetadata.androidApi < 24 ||
        nativeMetadata.androidApi > 35) {
    throw new GradleException('Unsupported staged Android ABI/API metadata (this host supports API 24 through 35).')
}
def sdlVersionHeader = new File(sdlRoot, 'include/SDL3/SDL_version.h')
def sdlVersionText = sdlVersionHeader.isFile() ? sdlVersionHeader.getText('UTF-8') : ''
def javaSdlVersion = ['MAJOR', 'MINOR', 'MICRO'].collect { part ->
    def match = sdlVersionText =~ /(?m)^\s*#define\s+SDL_${part}_VERSION\s+(\d+)\s*$/
    match.find() ? match.group(1) : '?'
}.join('.')
if (javaSdlVersion != nativeMetadata.sdlVersion) {
    throw new GradleException("SDL Java source ${javaSdlVersion} does not match staged native SDL ${nativeMetadata.sdlVersion}.")
}
def modMetadata = new JsonSlurper().parse(modMetadataFile)
def stagedVersion = modMetadata.version
if (!(stagedVersion instanceof String) || stagedVersion != modMetadata.requiredopenQ4Version) {
    throw new GradleException('Staged mod version must match requiredopenQ4Version.')
}
def versionMatch = stagedVersion =~ /^(\d+)\.(\d+)\.(\d+)(?:[-+][0-9A-Za-z.+-]+)?$/
if (!versionMatch.matches()) {
    throw new GradleException("Invalid staged openQ4 version: ${stagedVersion}")
}
def versionParts = (1..3).collect { versionMatch.group(it).toBigInteger() }
if (versionParts.any { it > 999 }) {
    throw new GradleException('Android version components must be between 0 and 999.')
}
// Preserve the initial APK's 0.13.0 -> 13000 numbering and increase on each
// patch release. Distributors can number successive prerelease builds explicitly.
def defaultVersionCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
def versionCodeText = providers.gradleProperty('openq4VersionCode').getOrElse(defaultVersionCode.toString())
if (!(versionCodeText ==~ /[1-9][0-9]*/) || versionCodeText.toBigInteger() > 2100000000) {
    throw new GradleException('openq4VersionCode must be an integer between 1 and 2100000000.')
}
def generatedJni = layout.buildDirectory.dir('generated/openq4/jniLibs')
def generatedAssets = layout.buildDirectory.dir('generated/openq4/assets')
def generatedResources = layout.buildDirectory.dir('generated/openq4/res')
def headsetMarker = 'openq4-headset'

// The Quest manifest is the phone manifest with the headset declarations
// added, so the two cannot drift: the head-tracking requirement, the OpenXR
// loader's permissions and runtime-broker queries, the supported headsets,
// and the categories that open setup as a 2D panel and the game immersive.
// verify_android_apk.py --variant quest checks the result.
def questManifest = layout.buildDirectory.file('generated/openq4/quest/AndroidManifest.xml')
if (questBuild) {
    def text = file('src/main/AndroidManifest.xml').getText('UTF-8').replace('\r\n', '\n')
    def insertAt = { String anchor, boolean before, String addition ->
        int at = text.indexOf(anchor)
        if (at < 0 || text.indexOf(anchor, at + 1) >= 0) {
            throw new GradleException("Quest manifest: the phone manifest no longer has exactly one ${anchor.trim()}")
        }
        int point = before ? at : at + anchor.length()
        text = text.substring(0, point) + addition + text.substring(point)
    }
    insertAt('    <application', true, '''    <!-- Meta Quest flavor (openq4Quest): an immersive OpenXR headset app. -->
    <uses-feature android:name="android.hardware.vr.headtracking" android:required="true" android:version="1" />
    <uses-permission android:name="org.khronos.openxr.permission.OPENXR" />
    <uses-permission android:name="org.khronos.openxr.permission.OPENXR_SYSTEM" />
    <queries>
        <provider android:authorities="org.khronos.openxr.runtime_broker;org.khronos.openxr.system_runtime_broker" />
        <intent><action android:name="org.khronos.openxr.OpenXRRuntimeService" /></intent>
        <intent><action android:name="org.khronos.openxr.OpenXRApiLayerService" /></intent>
    </queries>
''')
    insertAt('        <activity\n            android:name=".LauncherActivity"', true,
        '''        <meta-data android:name="com.oculus.supportedDevices" android:value="quest2|questpro|quest3|quest3s" />
''')
    insertAt('<category android:name="android.intent.category.LAUNCHER" />', false, '''
                <!-- setup checks the Quake 4 files on a 2D panel -->
                <category android:name="com.oculus.intent.category.2D" />''')
    int game = text.indexOf('android:name=".OpenQ4Activity"')
    int close = game < 0 ? -1 : text.indexOf('/>', game)
    if (close < 0 || text.indexOf('<', game) < close) {
        throw new GradleException('Quest manifest: the phone manifest no longer declares OpenQ4Activity as one empty element')
    }
    text = text.substring(0, close) + '''>
            <!-- immersive: the game presents to the headset through OpenXR -->
            <meta-data android:name="com.oculus.vr.focusaware" android:value="true" />
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="com.oculus.intent.category.VR" />
                <category android:name="org.khronos.openxr.intent.category.IMMERSIVE_HMD" />
            </intent-filter>
        </activity>''' + text.substring(close + 2)
    def generated = questManifest.get().asFile
    generated.parentFile.mkdirs()
    generated.setText(text, 'UTF-8')
}
def launcherIcon = file('../../../assets/icons/quake4_512.png')

tasks.register('stageOpenQ4Icon', Sync) {
    // Reuse the official desktop application artwork without duplicating or
    // modifying the source image. Android scales this density-independent icon.
    from(launcherIcon)
    into(generatedResources.map { it.dir('mipmap-nodpi') })
    rename { 'ic_launcher.png' }
    doFirst {
        if (!launcherIcon.isFile()) {
            throw new GradleException('Missing the official openQ4 application icon.')
        }
    }
}

tasks.register('stageOpenQ4Native', Sync) {
    from(new File(nativeStage, 'lib')) { include '*.so' }
    if (xrTestRuntime != null) {
        from(xrTestRuntime)
    }
    into(generatedJni.map { it.dir(abi) })
    doFirst {
        def actual = fileTree(new File(nativeStage, 'lib')).matching { include '**/*' }
            .files.collect { new File(nativeStage, 'lib').toPath().relativize(it.toPath()).toString() }.toSet()
        if (actual != nativeLibraries) {
            throw new GradleException("Expected exactly the seven ${abi} native libraries; missing ${nativeLibraries - actual}, unexpected ${actual - nativeLibraries}.")
        }
    }
}

tasks.register('stageOpenQ4Assets', Sync) {
    from(new File(nativeStage, 'baseoq4')) { into 'baseoq4' }
    from(new File(nativeStage, 'licenses')) { into 'licenses' }
    from(nativeStage) { include 'LICENSE', 'LICENSING.md', 'CONTRIBUTORS.md', 'android-build.json' }
    // OpenQ4Activity starts a headset build in VR when this marker exists
    if (questBuild) {
        from(nativeStage) { include headsetMarker }
    }
    // Setup is visible before the engine unpacks pak0. Reuse its exact faces,
    // rather than checking in duplicate fonts or depending on extracted data.
    from({ zipTree(new File(nativeStage, 'baseoq4/pak0.pk4')) }) {
        include 'fonts/marine.ttf', 'fonts/lowpixel.ttf'
    }
    into(generatedAssets)
    doFirst {
        (openQ4ContentPackNames().collect { "baseoq4/${it}" } + ['baseoq4/mod.json',
         'LICENSE', 'LICENSING.md', 'CONTRIBUTORS.md', 'licenses/QUAKE-4-SDK-EULA.rtf',
         'licenses/MD4.txt']).each { name ->
            if (!new File(nativeStage, name as String).isFile()) {
                throw new GradleException("Missing staged ${name}; run the Meson install step first.")
            }
        }
        if (!new File(nativeStage, 'licenses').isDirectory()) {
            throw new GradleException('Missing staged dependency license notices.')
        }
        if (questBuild != new File(nativeStage, headsetMarker).isFile()) {
            throw new GradleException(questBuild ? "The Quest stage lacks its ${headsetMarker} marker." :
                "Only a Quest stage may carry the ${headsetMarker} marker.")
        }
    }
    doLast {
        ['fonts/marine.ttf', 'fonts/lowpixel.ttf'].each { name ->
            if (!new File(generatedAssets.get().asFile, name).isFile()) {
                throw new GradleException("Missing setup typeface in staged pak0: ${name}")
            }
        }
        // Each APK gets a content-addressed private package directory. A failed
        // extraction or damaged copy can be repaired from the verified manifest.
        byte[] manifest = openQ4PackageManifest(new File(generatedAssets.get().asFile, 'baseoq4'))
        new File(generatedAssets.get().asFile, 'openq4-package-manifest.txt').bytes = manifest
        new File(generatedAssets.get().asFile, 'openq4-package-version.txt').setText(
            MessageDigest.getInstance('SHA-256').digest(manifest).encodeHex().toString(), 'US-ASCII')
    }
}

android {
    namespace 'com.darkmatter.openq4'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        // An emulator installation has its own data/saves and cannot update a
        // phone installation. Keep the established phone identity unchanged.
        // The Quest flavor has its own identity too, so a headset build never
        // replaces or reads a phone installation's data.
        applicationId emulator ? 'com.darkmatter.openq4.emulator' :
            (questBuild ? 'com.darkmatter.openq4.quest' : 'com.darkmatter.openq4')
        manifestPlaceholders = [openq4AppLabel: emulator ? '@string/app_name_emulator' : '@string/app_name']
        minSdk nativeMetadata.androidApi.intValue()
        targetSdk 35
        versionCode versionCodeText.toInteger()
        versionName stagedVersion
        ndk { abiFilters abi }
    }
    sourceSets.main {
        java.srcDir sdlJava
        jniLibs.srcDir generatedJni
        assets.srcDir generatedAssets
        res.srcDir generatedResources
        if (questBuild) {
            manifest.srcFile questManifest.get().asFile
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    bundle {
        // The setup language switch must work offline, before game data exists.
        language { enableSplit = false }
    }
    packaging {
        // Engine/game renderer modules are dlopen'ed from nativeLibraryDir.
        jniLibs.useLegacyPackaging = true
        // Meson/NDK already strips release libraries. Keep those exact bytes
        // so APK verification can compare every DSO with the validated stage.
        jniLibs.keepDebugSymbols += ['**/*.so']
    }
    androidResources {
        // PK4s are already compressed ZIP archives. Recompressing hundreds of
        // MB in parallel can exhaust the Gradle heap and saves little space.
        noCompress += ['pk4']
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
// A diagnostic ABI has no release APK or bundle task, even when explicitly
// requested by a caller that supplies signing credentials.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        if (emulator) variant.enable = false
    }
}

tasks.named('preBuild').configure {
    dependsOn 'stageOpenQ4Native', 'stageOpenQ4Assets', 'stageOpenQ4Icon'
}
