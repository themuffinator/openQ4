// Normal session diagnostics; no host mouse, keyboard or controller input.
openq4_retainedGui report
openq4_retainedGui focus "managed-brightness"
openq4_retainedGui menu accept 1
openq4_retainedGui menu accept 0
wait 2
openq4_retainedGui report
openq4_retainedGui focus "managed-shadows"
openq4_retainedGui menu accept 1
openq4_retainedGui menu accept 0
wait 2
openq4_retainedGui report
openq4_retainedGui save
// Commit a different application batch and apply it to the real host CVars.
openq4_retainedGui state "brightnessTarget" "1.25"
openq4_retainedGui state "shadowsTarget" "true"
openq4_retainedGui focus "managed-brightness"
openq4_retainedGui menu accept 1
openq4_retainedGui menu accept 0
openq4_retainedGui focus "managed-shadows"
openq4_retainedGui menu accept 1
openq4_retainedGui menu accept 0
wait 2
openq4_retainedGui report
openq4_guiGet "brightness-target-reading::text"
openq4_guiGet "shadows-target-reading::text"
// Restore the framed native adapter payload and verify its following sentinel.
// Host sources stay authoritative; restoring must not replay either action.
openq4_retainedGui restore
wait 2
openq4_retainedGui report
openq4_guiGet "brightness-reading::text"
openq4_guiGet "shadows-reading::text"
openq4_guiGet "brightness-target-reading::text"
openq4_guiGet "shadows-target-reading::text"
