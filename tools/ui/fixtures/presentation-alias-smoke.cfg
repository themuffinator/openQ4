openq4_retainedGui presentation "title::text" "#str_200148" 1
openq4_guiGet "title::text"
openq4_retainedGui presentation "title::text" "#str_200009" 1
openq4_guiGet "title::text"
openq4_retainedGui presentation "panel::visible" "0" 1
openq4_guiGet "panel::visible"
openq4_retainedGui presentation "panel::visible" "1" 1
openq4_guiGet "panel::visible"
wait 2
// Parent noevents must cancel a previously armed child without a failed op.
openq4_retainedGui focus "managed-shadows"
openq4_retainedGui menu accept 1
openq4_retainedGui presentation "panel::noevents" "1" 1
wait 2
openq4_guiGet "panel::noevents"
openq4_retainedGui menu accept 0
wait 2
openq4_retainedGui report
openq4_retainedGui presentation "panel::noevents" "0" 1
