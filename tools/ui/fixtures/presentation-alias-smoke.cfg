// Semantic presentation probe; no host mouse, keyboard or controller input.
openq4_retainedGui report
openq4_guiGet "curr"
openq4_guiGet "desktop::curr"
openq4_retainedGui state "aliasSource" "3"
openq4_guiGet "curr"
// A transient write is immediately shared, then the next update evaluates it.
openq4_retainedGui presentation "CuRR" "7" 0
openq4_guiGet "curr"
openq4_guiGet "desktop::curr"
openq4_retainedGui update
openq4_guiGet "curr"
// Explicit ownership survives source changes and a later transient write.
openq4_retainedGui presentation "curr" "9" 1
openq4_retainedGui state "aliasSource" "4"
openq4_guiGet "curr"
openq4_retainedGui presentation "desktop::curr" "11" 0
openq4_retainedGui update
openq4_guiGet "curr"
openq4_guiGet "desktop::curr"
// Repeat the ownership contract for a rendered, expression-bound property.
openq4_guiGet "panel::opacity"
openq4_retainedGui presentation "panel::opacity" "0.25" 0
openq4_guiGet "panel::opacity"
openq4_retainedGui update
openq4_guiGet "panel::opacity"
