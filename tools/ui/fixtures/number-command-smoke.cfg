// Semantic commands exercise current-buffer layout after gameplay. No device
// input is injected. The Number fixture must already be open with testGUI.
openq4_retainedGui focus "number"
openq4_retainedGui number begin "number"
openq4_retainedGui number replace "number" "1.25"
openq4_retainedGui number command "number" "left" "extend"
wait 3
openq4_retainedGui widget "number"
screenshot "screenshots/number-selection.tga"
openq4_retainedGui number command "number" "backspace"
wait 3
openq4_retainedGui widget "number"
screenshot "screenshots/number-deleted.tga"
openq4_retainedGui number undo "number"
wait 3
openq4_retainedGui widget "number"
screenshot "screenshots/number-undo.tga"
// These commands intentionally share one event batch, without a painted frame
// between replacements and movement through the newly measured buffer.
openq4_retainedGui number command "number" "select-all"
openq4_retainedGui number replace "number" "1.875"
openq4_retainedGui number command "number" "left" "extend"
openq4_retainedGui number command "number" "left" "extend"
openq4_retainedGui widget "number"
openq4_retainedGui number command "number" "backspace"
openq4_retainedGui number undo "number"
openq4_retainedGui number command "number" "end"
openq4_retainedGui number command "number" "home" "extend"
openq4_retainedGui number replace "number" "1.375"
openq4_retainedGui number commit "number"
wait 3
openq4_retainedGui widget "number"
r_brightness
screenshot "screenshots/number-accepted.tga"
echo NUMBER_COMMAND_SMOKE_COMPLETE
